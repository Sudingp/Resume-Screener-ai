name: "Vulnerability Scan (Python Backend & Node Frontend)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: read
  security-events: write # Required to upload SARIF vulnerability reports to GitHub Security tab

jobs:
  # ==========================================
  # 1. PYTHON BACKEND VULNERABILITY SCAN
  # ==========================================
  python-backend-vulnerabilities:
    name: Python Backend Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade Pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install bandit pip-audit bandit-sarif-formatter

      - name: Scan Python Dependencies with pip-audit
        run: |
          echo "Scanning Python packages against Python Packaging Advisory Database..."
          pip-audit --desc on

      - name: Scan Python Source Code with Bandit (SAST)
        run: |
          echo "Running Bandit SAST scan..."
          bandit -r src -ll -f sarif -o bandit-results.sarif || true

      - name: Upload Bandit Vulnerability SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit-python

  # ==========================================
  # 2. NODE FRONTEND VULNERABILITY SCAN
  # ==========================================
  node-frontend-vulnerabilities:
    name: Node Frontend Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Audit Node Frontend Dependencies
        run: |
          npm install --package-lock-only || true
          echo "Auditing Node/npm dependencies for vulnerabilities..."
          npm audit --audit-level=moderate || true

  # ==========================================
  # 3. TRIVY COMPREHENSIVE REPOSITORY CVE SCAN
  # ==========================================
  trivy-security-scan:
    name: Trivy All-in-One Vulnerability Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-repo-scan
