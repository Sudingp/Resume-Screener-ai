name: Security & Vulnerability Audits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly automated security scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  python-backend-security:
    name: Python Backend Vulnerability & Quality Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install bandit pip-audit

      - name: Run Bandit (SAST Security Scanner)
        run: |
          echo "Scanning Python source code for security flaws..."
          bandit -r src -ll

      - name: Run pip-audit (Dependency CVE Scanner)
        run: |
          echo "Auditing Python dependencies for known vulnerabilities..."
          pip-audit

      - name: Generate synthetic test fixtures
        run: |
          python tests/fixtures/make_fixtures.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
        run: |
          echo "Running automated unit and integration tests..."
          pytest -q

  node-frontend-security:
    name: Node Frontend Dependency & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install and Audit Node Dependencies
        run: |
          npm install || true
          echo "Running npm audit for frontend dependencies..."
          npm audit --audit-level=moderate || true

  secrets-leak-scan:
    name: Credentials & Secrets Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secret leaks (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
